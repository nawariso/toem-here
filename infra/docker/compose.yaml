name: toem-here
services:
  postgres:
    # PostgreSQL 18.6 + PostGIS 3.6.4 (stable). Keep identical to .github/workflows/quality.yml.
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toem_here}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-toem_here}
    ports:
      - "5432:5432"
    volumes:
      - toem_here_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-toem_here} -d ${POSTGRES_DB:-toem_here}"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  toem_here_postgres:
